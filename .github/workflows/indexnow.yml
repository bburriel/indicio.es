# Después de cada publicación en main, avisa a IndexNow de las páginas cambiadas (Cloudflare Pages tarda ~2 min en publicar).
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      todo:
        description: "Incluir las fichas de municipios"
        type: boolean
        default: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Esperar a que Cloudflare publique
        run: sleep 240
      - name: Avisar
        run: |
          if [ "${{ inputs.todo }}" = "true" ] || git diff --name-only HEAD~1 HEAD | grep -q '^data/index.json$'; then
            node scripts/indexnow.mjs todo
          else
            node scripts/indexnow.mjs
          fi
